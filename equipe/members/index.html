  <!-- JSON-LD structured data (Schema.org) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "offrm studio",
    "alternateName": ["offrmstudio", "offrm studio creative", "offrm", "offroom"],
    "url": "https://offrmstudio.com/equipe/members/",
    "description": "Creative studio dedicated to brand representation, audiovisual production and curation of exhibitions and events.",
    "logo": "https://offrmstudio.com/social-preview.png",
    "sameAs": ["https://www.instagram.com/offrmstudio", "https://www.linkedin.com/company/offrmstudio"]
  }
  </script>
</head>

<body class="page-equipefrontpage">

  <a href="/index.html" class="site-name">offrm studio</a>


  <div class="burger" onclick="toggleMenu()"></div>

  <nav class="menu" id="menu">
    <a href="/about/">about</a>
    <a href="/equipe/members/">members</a>
    <a href="/services-en/">services</a>

  </div>


  <!-- FOOTER -->
  <div class="footer-bar">
  <div class="copyright">© 2026 offrm studio. All rights reserved.</div>
  <div class="language-selector">
    <a href="#" onclick="setLanguage('fr')">FR</a> | 
    <a href="#" onclick="setLanguage('en')">EN</a>
  </div>
</div>


<script>
  function toggleMenu() {
    const menu = document.getElementById('menu');
    menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
  }

  function setLanguage(lang) {
    localStorage.setItem('lang', lang);
    if(lang === 'fr') {
      window.location.href = '/equipe/';
    } else if(lang === 'en') {
      window.location.href = '/equipe/members/';
    }
  }

  const savedLang = localStorage.getItem('lang');
  if(savedLang === 'fr' && window.location.pathname.includes('/equipe/members/')) {
    window.location.href = '/equipe/';
  }
</script>

</body>
</html>
