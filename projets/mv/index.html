<body class="page-projet-mv">

    <div class="language-selector">
      <a href="#" onclick="setLanguage('fr')">fr</a> |
      <a href="#" onclick="setLanguage('en')">en</a>
    </div>
  </div>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('menu');
      menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
    }

    function setLanguage(lang) {
      localStorage.setItem('lang', lang);
      if (lang === 'fr') {
        window.location.href = '/projets/mv/';
      } else if (lang === 'en') {
        window.location.href = '/projets/mv/en/';
      }
    }

    const savedLang = localStorage.getItem('lang');
    if (savedLang === 'fr' && window.location.pathname.includes('/projets/mv/en/')) {
      window.location.href = '/projets/mv/';
    }
  </script>
</body>
